# Static analysis configuration for Thaheen Mini Offline LMS.
#
# Policy: `flutter analyze` must report zero issues before any commit.

include: package:flutter_lints/flutter.yaml

# riverpod_lint ships as a native analysis-server plugin (no custom_lint runner).
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"

  errors:
    # Generated-code hygiene and RTL correctness are non-negotiable here.
    invalid_annotation_target: ignore

  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # --- Style rules mandated by CLAUDE.md ---
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_final_in_for_each

    # --- Arabic / RTL safety: forbid directional-agnostic padding ---
    - use_named_constants
    - sort_child_properties_last

    # --- General correctness ---
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_redundant_argument_values
    - cast_nullable_to_non_nullable
    - directives_ordering
    - omit_local_variable_types
    - always_use_package_imports
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
