name: thaheen_task
description: "Thaheen Mini Offline LMS — an Arabic-first, fully offline learning app for health-sciences students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Ships Material/Cupertino localisations so Arabic (ar) is a first-class locale.
  flutter_localizations:
    sdk: flutter

  # --- State management: Riverpod with code generation (@riverpod) ---
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # --- Navigation ---
  go_router: ^18.0.1

  # --- Local persistence: Hive only (community edition, actively maintained) ---
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4

  # --- Video playback ---
  video_player: ^2.14.0

  # --- Responsive sizing (single source of truth for breakpoints) ---
  responsive_framework: ^1.5.1

  easy_localization: ^3.0.8

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Codegen + Riverpod-specific static analysis.
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/translations/
    - assets/images/
    - assets/videos/

  fonts:
    # Cairo (SIL Open Font License 1.1) — bundled so the app never touches the network.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
